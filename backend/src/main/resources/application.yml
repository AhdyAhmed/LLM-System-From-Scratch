spring:
  application:
    name: scratchllm-backend
  datasource:
    url: ${LLM_DB_JDBC_URL:jdbc:postgresql://127.0.0.1:54322/llm_app}
    username: ${LLM_DB_USER:llm_app_user}
    password: ${LLM_DB_PASSWORD:llm_app_local_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
