openapi: 3.1.0
info:
  title: ScratchLLM Conversational AI Platform API
  version: 1.0.0
  description: >
    Headless API contract for authenticated workspace conversations, idempotent generation runs,
    durable Server-Sent Events (SSE) streaming with cursor replay, workspace document retrieval,
    model catalog provenance, and daily token quota accounting.
servers:
  - url: http://127.0.0.1:8080
    description: Local Java API server
security:
  - SessionCookie: []
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Bootstrap session cookie and CSRF token for cookie-jar API clients
      security: []
      responses:
        "200":
          description: CSRF token payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a local demo user account
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created with default workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate user and rotate Redis-backed session
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      summary: Invalidate current session in Redis
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Session invalidated
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current authenticated user and authorized workspaces
      responses:
        "200":
          description: User profile and workspace memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/workspaces/{workspaceId}/conversations:
    post:
      operationId: createConversation
      summary: Create a creator-private conversation inside a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryResponse"
    get:
      operationId: listConversations
      summary: Keyset-paginated list of caller-owned conversations in workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Paginated conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPageResponse"
  /api/v1/conversations/{conversationId}:
    patch:
      operationId: renameConversation
      summary: Rename conversation with optimistic locking version check
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameConversationRequest"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteConversation
      summary: Tombstone conversation, cancel active run, and schedule cleanup
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Conversation tombstoned
  /api/v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: Keyset-paginated messages for an authorized creator-owned conversation
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Ordered messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageResponse"
  /api/v1/conversations/{conversationId}/runs:
    post:
      operationId: submitGenerationRun
      summary: Idempotent submission of a prompt for asynchronous generation
      parameters:
        - $ref: "#/components/parameters/ConversationIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRunRequest"
      responses:
        "202":
          description: Run accepted and queued for execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAcceptedResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/runs/{runId}:
    get:
      operationId: getRunStatus
      summary: Durable status, output snapshot, model provenance, and token usage
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
      responses:
        "200":
          description: Run status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatusResponse"
  /api/v1/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      summary: Server-Sent Events stream with sequence IDs and cursor replay
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: SSE event stream (`text/event-stream`)
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Idempotent cancellation request for a queued or running generation
      parameters:
        - $ref: "#/components/parameters/RunIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Cancellation state recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatusResponse"
  /api/v1/models:
    get:
      operationId: listModels
      summary: List allowed models with immutable registry provenance and capability limits
      responses:
        "200":
          description: Model catalog entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
  /api/v1/workspaces/{workspaceId}/documents:
    post:
      operationId: uploadDocument
      summary: Bounded UTF-8 text/Markdown upload for asynchronous ingestion
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Document accepted for ingestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocumentStatus
      summary: Retrieve workspace-authorized document ingestion status
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
      responses:
        "200":
          description: Document status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
    delete:
      operationId: deleteDocument
      summary: Delete document (restricted to uploader or workspace OWNER)
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Document tombstoned and scheduled for chunk purge
  /api/v1/workspaces/{workspaceId}/search:
    post:
      operationId: searchWorkspaceDocuments
      summary: Authorized lexical or vector retrieval with inspectable source excerpts
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Ranked document chunks and source citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /api/v1/messages/{messageId}/feedback:
    post:
      operationId: submitMessageFeedback
      summary: Record explicit user feedback on an assistant message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback persisted
  /api/v1/usage:
    get:
      operationId: getUsageSummary
      summary: Caller-scoped daily token allowance, active reservations, and settled usage
      responses:
        "200":
          description: Quota and usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryResponse"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Structured machine-readable API error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required: [error_code, message, request_id, timestamp]
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    CsrfTokenResponse:
      type: object
      required: [header_name, parameter_name, token]
      properties:
        header_name:
          type: string
          example: X-CSRF-TOKEN
        parameter_name:
          type: string
          example: _csrf
        token:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, workspace_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        workspace_name:
          type: string
          minLength: 2
          maxLength: 80
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserProfileResponse:
      type: object
      required: [user_id, email, workspaces]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        workspaces:
          type: array
          items:
            type: object
            required: [workspace_id, name, role]
            properties:
              workspace_id:
                type: string
                format: uuid
              name:
                type: string
              role:
                type: string
                enum: [OWNER, MEMBER]
    CreateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
    RenameConversationRequest:
      type: object
      required: [title, version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        version:
          type: integer
          minimum: 0
    ConversationSummaryResponse:
      type: object
      required: [conversation_id, workspace_id, owner_user_id, title, version, updated_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time
    ConversationPageResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummaryResponse"
        next_cursor:
          type: ["string", "null"]
        has_more:
          type: boolean
    MessagePageResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            required: [message_id, conversation_id, role, content, status, message_order, created_at]
            properties:
              message_id:
                type: string
                format: uuid
              conversation_id:
                type: string
                format: uuid
              run_id:
                type: ["string", "null"]
                format: uuid
              role:
                type: string
                enum: [SYSTEM, USER, ASSISTANT]
              content:
                type: string
              status:
                type: string
                enum: [COMMITTED, PARTIAL_FAILED, CANCELLED]
              message_order:
                type: integer
              created_at:
                type: string
                format: date-time
        next_cursor:
          type: ["string", "null"]
        has_more:
          type: boolean
    SamplingOptions:
      type: object
      required: [max_new_tokens, temperature, top_k, top_p]
      properties:
        max_new_tokens:
          type: integer
          minimum: 1
          maximum: 64
          default: 32
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 0.8
        top_k:
          type: integer
          minimum: 1
          maximum: 256
          default: 40
        top_p:
          type: number
          minimum: 0.05
          maximum: 1.0
          default: 0.95
        seed:
          type: ["integer", "null"]
    SubmitRunRequest:
      type: object
      required: [prompt, model_alias, sampling]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 16384
        model_alias:
          type: string
          enum: [fake-deterministic, scratch-tiny, scratch-local]
        sampling:
          $ref: "#/components/schemas/SamplingOptions"
        document_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    RunAcceptedResponse:
      type: object
      required: [run_id, conversation_id, status, model_revision, events_url, status_url]
      properties:
        run_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, CANCELLED, FAILED]
        model_revision:
          type: string
        events_url:
          type: string
        status_url:
          type: string
    RunStatusResponse:
      type: object
      required: [run_id, conversation_id, status, model_revision, reserved_tokens, input_tokens, output_tokens, created_at]
      properties:
        run_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, CANCELLED, FAILED]
        model_revision:
          type: string
        finish_reason:
          type: ["string", "null"]
          enum: [stop, length, cancelled, error, null]
        output_text:
          type: string
        reserved_tokens:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        error_code:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
    ModelCatalogResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [alias, model_revision, registry_version, tokenizer_hash, context_limit, max_output_tokens, is_scratch_model, capability_note]
            properties:
              alias:
                type: string
              model_revision:
                type: string
              registry_version:
                type: string
              tokenizer_hash:
                type: string
              context_limit:
                type: integer
              max_output_tokens:
                type: integer
              is_scratch_model:
                type: boolean
              capability_note:
                type: string
    DocumentStatusResponse:
      type: object
      required: [document_id, workspace_id, filename, status, created_at]
      properties:
        document_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum: [PENDING, PROCESSING, READY, FAILED, DELETED]
        created_at:
          type: string
          format: date-time
    SearchRequest:
      type: object
      required: [query, mode, top_k]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 512
        mode:
          type: string
          enum: [lexical, vector]
        top_k:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [chunk_id, document_id, title, location, score, excerpt]
            properties:
              chunk_id:
                type: string
                format: uuid
              document_id:
                type: string
                format: uuid
              title:
                type: string
              location:
                type: string
              score:
                type: number
              excerpt:
                type: string
    FeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: string
          enum: [UP, DOWN]
        reason:
          type: ["string", "null"]
          maxLength: 500
    UsageSummaryResponse:
      type: object
      required: [utc_date, daily_limit_tokens, reserved_tokens, settled_tokens, remaining_tokens]
      properties:
        utc_date:
          type: string
          format: date
        daily_limit_tokens:
          type: integer
        reserved_tokens:
          type: integer
        settled_tokens:
          type: integer
        remaining_tokens:
          type: integer
