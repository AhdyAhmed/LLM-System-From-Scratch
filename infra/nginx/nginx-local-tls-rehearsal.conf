# Day102: Reverse Proxy & Local HTTPS/TLS Rehearsal Configuration
# Terminates local TLS on 127.0.0.1:8443 (with HTTP redirect on 127.0.0.1:8090),
# forwards X-Forwarded-Proto/For/Port headers, enforces Secure/HttpOnly/SameSite=Lax cookie pass-through,
# bounds client_max_body_size, and disables proxy buffering for SSE streams.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    upstream scratchllm_api_replicas {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost;

        ssl_certificate     certs/local-rehearsal.crt;
        ssl_certificate_key certs/local-rehearsal.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://scratchllm_api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_cookie_flags ~ secure httponly samesite=lax;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Unbuffered SSE endpoint over HTTPS
        location ~ ^/api/v1/runs/[^/]+/events$ {
            proxy_pass http://scratchllm_api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            tcp_nopush off;
            tcp_nodelay on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-cache, no-transform" always;
        }
    }
}
