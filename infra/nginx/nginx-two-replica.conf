# Day093: Stateless Two-Replica Reverse Proxy & Unbuffered SSE Configuration
# Routes HTTP & SSE requests round-robin across replica-1 (127.0.0.1:8080) and replica-2 (127.0.0.1:8082)
# without sticky sessions. Session state, CSRF tokens, rate limits, and model metadata are shared via Redis/PostgreSQL.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout 65;

    upstream scratchllm_api_replicas {
        # Stateless round-robin load balancing across two Spring Boot API replicas
        server 127.0.0.1:8080 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        # Standard API endpoints
        location /api/v1/ {
            proxy_pass http://scratchllm_api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Day093: Unbuffered Server-Sent Events (SSE) streaming endpoint
        location ~ ^/api/v1/runs/[^/]+/events$ {
            proxy_pass http://scratchllm_api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Disable all proxy buffering and caching so token.delta events flush immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            tcp_nopush off;
            tcp_nodelay on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header X-Accel-Buffering "no" always;
            add_header Cache-Control "no-cache, no-transform" always;
        }
    }
}
